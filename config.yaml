# ---------------------------------------------------------------------------
# ebay_watcher.py config
#
# Secrets (Telegram bot token/chat id, eBay App ID/Cert ID) are NOT stored
# here - this file gets committed to git. They're read from environment
# variables instead: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, EBAY_APP_ID,
# EBAY_CERT_ID. Locally those are set as persistent user env vars; in
# GitHub Actions they come from the repo's encrypted Secrets.
#
# `defaults:` applies to every search unless a search overrides that field.
# Add as many entries under `searches:` as you want - each runs on its own
# independent schedule.
#
# Optional per-search `deal_price`: set it to the recent SOLD price (look it
# up with eBay's "Sold items" filter; the API can't provide it). Any listing at
# or below it alerts with a 🔥 DEAL banner, even if it's above max_price.
# min_price and every other filter still apply. Listings between deal_price
# and max_price still alert normally, without the banner. If deal_price is
# higher than max_price, every alert for that search is a deal.
# Example:   deal_price: 650
# ---------------------------------------------------------------------------

defaults:
  marketplace: EBAY_GB      # e.g. EBAY_US, EBAY_GB, EBAY_DE ...
  currency: GBP
  poll_seconds: 300         # how often to check (5 min)

searches:
  - name: L-mount lenses under 200
    query: L mount
    category_ids: "78997"      # eBay's Camera Lenses category - keeps unrelated
                                # junk (e.g. car parts matching "L"/"mount") out
                                # entirely, since keyword-only search is too loose
    item_location_country: GB  # UK-located listings only - excludes "from Japan"
                                # etc. cross-border listings
    max_price: 200
    # Condition filtering (per search - other searches are unaffected).
    # Accepts eBay's numeric condition ids, or these names: new, new other
    # (= open box), new with defects, certified refurbished, excellent
    # refurbished, very good refurbished, good refurbished, seller
    # refurbished, like new, used, very good, good, acceptable, for parts
    # (= for parts or not working). Use exclude_conditions for a blocklist,
    # or include_conditions for an allowlist (only these conditions pass).
    exclude_conditions:
      - for parts
    exclude_keywords:
      - l39                    # vintage Leica screw-mount (LTM) lenses - a
      - ltm                    # different, older mount often confused with
      - m39                    # modern "L-mount"
      - screw mount
      - adapter
      - adaptor
      - hood
      - cap
      - cover
      - case
      # Lenses already owned - excluded so they don't notify:
      - 20-60mm                # Panasonic Lumix S 20-60mm f/3.5-5.6 (unique
                                # focal length, no other L-mount lens shares it)
      - s-s50                  # Panasonic Lumix S 50mm f/1.8's part number
      - 50mm f1.8               # ...and common title phrasings for it (kept
      - 50mm f/1.8              # distinct from the pricier "S PRO 50mm F1.4",
      - 50 mm f1.8              # part number S-X50, which is NOT excluded)
    # Requires the literal phrase "L mount"/"L-mount", or a "Lumix S"/
    # "Panasonic S" model name (Panasonic's S-series is L-mount only, so
    # that's a safe signal even when a listing doesn't spell out "L mount").
    title_regex: '\bL[\s\-]?mount\b|\b(?:Lumix|Panasonic)\s+S\b'

  - name: Sigma 100-400mm L-mount
    query: Sigma 100-400mm f/5-6.3 DG DN OS Contemporary
    category_ids: "78997"
    item_location_country: GB
    exclude_conditions:
      - for parts
    # This lens also ships in Sony E-mount and Fuji X-mount - require the
    # literal "L mount"/"L-mount" phrase (every listing we checked spells
    # the mount out explicitly) so only the L-mount version gets through.
    title_regex: '\bL[\s\-]?mount\b|\b(?:Lumix|Panasonic)\s+S\b'

  - name: Panasonic 70-300mm L-mount
    query: Panasonic Lumix S 70-300mm f/4.5-5.6 MACRO O.I.S
    category_ids: "78997"
    item_location_country: GB
    exclude_conditions:
      - for parts
    title_regex: '\bL[\s\-]?mount\b|\b(?:Lumix|Panasonic)\s+S\b'

  - name: Nikon Coolpix P1100
    query: Nikon Coolpix P1100
    # eBay's Digital Cameras category. Without it, ~70% of hits are paperback
    # "user guide" books, bags, tripods and batteries named after the camera.
    category_ids: "31388"
    item_location_country: GB
    min_price: 300             # real units are ~£400+; anything below is a
                                # misfiled accessory or "box only" listing
    max_price: 550             # only alert on deals (cheapest live listing
                                # was £665 when this was set)
    exclude_conditions:
      - for parts
    exclude_keywords:          # safety net for sellers who put it in the title
      - for parts              # but pick a normal condition
      - spares
      - faulty
      - not working
      - broken
      - box only
      - empty box
    # P1100 as its own token, so a P1000/P1100 mix-up can't slip through.
    # Bundles ("+ bag + tripod", "+ filter kit") are still the camera, so
    # bag/tripod/filter are deliberately NOT excluded here.
    title_regex: '(?<!\d)P[\s\-]?1100(?!\d)'

  # --- Standard-zoom shortlist (all L-mount, UK-located, no "for parts") ---
  # Each title_regex needs BOTH the focal range and an L-mount signal, since
  # most of these lenses also ship in Sony E / Canon RF versions. These are
  # deal alerts: max_price 300 is far below the going rate (£650+), so expect
  # silence until a real bargain appears. min_price 100 only drops hoods,
  # filters and caps; it is deliberately low so a £150-£250 find still alerts.

  - name: Sigma 28-70mm f/2.8 L-mount
    query: Sigma 28-70mm f/2.8 DG DN Contemporary
    category_ids: "78997"
    item_location_country: GB
    min_price: 100
    max_price: 300
    exclude_conditions:
      - for parts
    exclude_keywords:
      - filter set
      - adapter
      - adaptor
    title_regex: '(?=.*(?<!\d)28\s?[-–]\s?70(?!\d))(?=.*(?:\bL[\s\-]?(?:mount|fit)\b|\bLeica\s+L\b))'

  - name: Sigma 24-70mm f/2.8 Art L-mount (Mk I)
    query: Sigma 24-70mm f/2.8 DG DN Art
    category_ids: "78997"
    item_location_country: GB
    min_price: 100
    max_price: 300
    exclude_conditions:
      - for parts
    exclude_keywords:
      - filter set
      - adapter
      - adaptor
    # Mk I only: the third lookahead rejects "II" / "Mk 2" / "Mark 2" titles.
    title_regex: '(?=.*(?<!\d)24\s?[-–]\s?70(?!\d))(?=.*(?:\bL[\s\-]?(?:mount|fit)\b|\bLeica\s+L\b))(?!.*(?:\bII\b|\bMk\.?\s?2\b|\bMark\s?2\b))'

  - name: Panasonic Lumix S 24-60mm f/2.8
    query: Panasonic Lumix S 24-60mm f/2.8
    category_ids: "78997"
    item_location_country: GB
    min_price: 100
    max_price: 300
    exclude_conditions:
      - for parts
    exclude_keywords:
      - filter set
      - adapter
      - adaptor
    # "Lumix S" is L-mount only, so it counts as an L-mount signal by itself.
    title_regex: '(?=.*(?<!\d)24\s?[-–]\s?60(?!\d))(?=.*(?:\bL[\s\-]?(?:mount|fit)\b|\bLeica\s+L\b|\b(?:Lumix|Panasonic)\s+S\b))'

  - name: Samyang 35-150mm f/2-2.8 L-mount
    query: Samyang 35-150mm F2-2.8
    category_ids: "78997"
    item_location_country: GB
    min_price: 100
    max_price: 300
    exclude_conditions:
      - for parts
    exclude_keywords:
      - filter set
      - adapter
      - adaptor
    title_regex: '(?=.*(?<!\d)35\s?[-–]\s?150(?!\d))(?=.*(?:\bL[\s\-]?(?:mount|fit)\b|\bLeica\s+L\b))'

  - name: Sigma 28-45mm f/1.8 Art L-mount
    query: Sigma 28-45mm f/1.8 DG DN Art
    category_ids: "78997"
    item_location_country: GB
    min_price: 100
    max_price: 300
    exclude_conditions:
      - for parts
    exclude_keywords:
      - filter set
      - adapter
      - adaptor
    title_regex: '(?=.*(?<!\d)28\s?[-–]\s?45(?!\d))(?=.*(?:\bL[\s\-]?(?:mount|fit)\b|\bLeica\s+L\b))'

  - name: Sigma MC-21 (Canon EF to L)
    query: Sigma MC-21
    # eBay's Lens Mount Adapters category. A plain keyword search also pulls in
    # camera-body bundles ("S5IIX + 20-60mm + MC-21", ~£1,400), lens+adapter
    # bundles and the £4 firmware cable, none of which are in this category.
    category_ids: "30059"
    item_location_country: GB
    min_price: 30              # insurance against misfiled cables/caps
    exclude_conditions:
      - for parts
    exclude_keywords:          # safety net for sellers who put it in the title
      - for parts              # but pick a normal condition
      - spares
      - faulty
      - not working
      - broken
      - tripod                 # tripod-mount rings/collars made for the MC-21
      - collar                 # (£30ish accessories that carry its name)
    # MC-21 as its own token, Canon EF version only: the title must say "EF"
    # and must not mention "SA" (the Sigma SA -> L version). Listings that
    # don't name their version are skipped on purpose.
    title_regex: '(?=.*(?<![\w])MC[\s\-]?21(?!\d))(?=.*\bEF\b)(?!.*\bSA\b)'

  # Example of a further search - copy/edit/remove as you like:
  # - name: Sony A7 IV
  #   query: Sony A7 IV
  #   min_price: 500
  #   max_price: 1800
  #   exclude_keywords:
  #     - case
  #     - strap
  #     - battery
  #   marketplace: EBAY_GB
  #   poll_seconds: 600

# ---------------------------------------------------------------------------
# hukd_watcher.py - HotUKDeals alerts. Every new/trending deal's title and
# description is checked against each `pattern` (a case-insensitive regex);
# any match sends a Telegram message. Runs on the same 5-min schedule as
# the eBay searches.
# ---------------------------------------------------------------------------

hotukdeals:
  - name: Panasonic S1 V-Log key (DMW-SFU2)
    # The part number, "V-Log", or a Panasonic/Lumix upgrade/software/
    # activation key mentioned either way round.
    pattern: 'sfu2|\bv[\s-]log\b|(panasonic|lumix).*\b(upgrade|software|activation) key|\b(upgrade|software|activation) key\b.*(panasonic|lumix)'
