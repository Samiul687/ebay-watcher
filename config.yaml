# ---------------------------------------------------------------------------
# ebay_watcher.py config
#
# Secrets (Telegram bot token/chat id, eBay App ID/Cert ID) are NOT stored
# here - this file gets committed to git. They're read from environment
# variables instead: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, EBAY_APP_ID,
# EBAY_CERT_ID. Locally those are set as persistent user env vars; in
# GitHub Actions they come from the repo's encrypted Secrets.
#
# `defaults:` applies to every search unless a search overrides that field.
# Add as many entries under `searches:` as you want - each runs on its own
# independent schedule.
# ---------------------------------------------------------------------------

defaults:
  marketplace: EBAY_GB      # e.g. EBAY_US, EBAY_GB, EBAY_DE ...
  currency: GBP
  poll_seconds: 300         # how often to check (5 min)

searches:
  - name: L-mount lenses under 200
    query: L mount
    category_ids: "78997"      # eBay's Camera Lenses category - keeps unrelated
                                # junk (e.g. car parts matching "L"/"mount") out
                                # entirely, since keyword-only search is too loose
    item_location_country: GB  # UK-located listings only - excludes "from Japan"
                                # etc. cross-border listings
    max_price: 200
    # Condition filtering (per search - other searches are unaffected).
    # Accepts eBay's numeric condition ids, or these names: new, new other
    # (= open box), new with defects, certified refurbished, excellent
    # refurbished, very good refurbished, good refurbished, seller
    # refurbished, like new, used, very good, good, acceptable, for parts
    # (= for parts or not working). Use exclude_conditions for a blocklist,
    # or include_conditions for an allowlist (only these conditions pass).
    exclude_conditions:
      - for parts
    exclude_keywords:
      - l39                    # vintage Leica screw-mount (LTM) lenses - a
      - ltm                    # different, older mount often confused with
      - m39                    # modern "L-mount"
      - screw mount
      - adapter
      - adaptor
      - hood
      - cap
      - cover
      - case
      # Lenses already owned - excluded so they don't notify:
      - 20-60mm                # Panasonic Lumix S 20-60mm f/3.5-5.6 (unique
                                # focal length, no other L-mount lens shares it)
      - s-s50                  # Panasonic Lumix S 50mm f/1.8's part number
      - 50mm f1.8               # ...and common title phrasings for it (kept
      - 50mm f/1.8              # distinct from the pricier "S PRO 50mm F1.4",
      - 50 mm f1.8              # part number S-X50, which is NOT excluded)
    # Requires the literal phrase "L mount"/"L-mount", or a "Lumix S"/
    # "Panasonic S" model name (Panasonic's S-series is L-mount only, so
    # that's a safe signal even when a listing doesn't spell out "L mount").
    title_regex: '\bL[\s\-]?mount\b|\b(?:Lumix|Panasonic)\s+S\b'

  - name: Sigma 100-400mm L-mount
    query: Sigma 100-400mm f/5-6.3 DG DN OS Contemporary
    category_ids: "78997"
    item_location_country: GB
    exclude_conditions:
      - for parts
    # This lens also ships in Sony E-mount and Fuji X-mount - require the
    # literal "L mount"/"L-mount" phrase (every listing we checked spells
    # the mount out explicitly) so only the L-mount version gets through.
    title_regex: '\bL[\s\-]?mount\b|\b(?:Lumix|Panasonic)\s+S\b'

  - name: Panasonic 70-300mm L-mount
    query: Panasonic Lumix S 70-300mm f/4.5-5.6 MACRO O.I.S
    category_ids: "78997"
    item_location_country: GB
    exclude_conditions:
      - for parts
    title_regex: '\bL[\s\-]?mount\b|\b(?:Lumix|Panasonic)\s+S\b'

  # Example of a further search - copy/edit/remove as you like:
  # - name: Sony A7 IV
  #   query: Sony A7 IV
  #   min_price: 500
  #   max_price: 1800
  #   exclude_keywords:
  #     - case
  #     - strap
  #     - battery
  #   marketplace: EBAY_GB
  #   poll_seconds: 600
